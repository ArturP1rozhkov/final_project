# k8s/monitoring/values-kube-prometheus-stack.yaml

prometheus:
  prometheusSpec:
    retention: 6h
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    # диск ноды 20 ГБ, отдельный PVC не заводим — emptyDir
    storageSpec: {}

grafana:
  enabled: true
  persistence:
    enabled: false
  serviceMonitor:
    enabled: false
  service:
    type: NodePort
    nodePort: 30081
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    retention: 6h
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# etcd, controller-manager и scheduler на kubespray слушают 127.0.0.1,
# scrape до них не доходит — мёртвые таргеты не держим
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false

# kube-proxy на kubespray слушает метрики на 127.0.0.1:10249
kubeProxy:
  enabled: false

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
