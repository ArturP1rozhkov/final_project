# k8s/ingress/values-ingress-nginx.yaml

# балансировщик Yandex Cloud слушает 80 и проксирует TCP на 30080 каждой ноды,
# поэтому контроллер публикуется через NodePort, а не через Service type LoadBalancer
controller:
  kind: DaemonSet
  hostNetwork: true
  # с hostNetwork обычный ClusterFirst не работает
  dnsPolicy: ClusterFirstWithHostNet

  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443

  ingressClassResource:
    default: true

  # в кластере нет cert-manager, webhook-сертификаты создавать некому
  admissionWebhooks:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
