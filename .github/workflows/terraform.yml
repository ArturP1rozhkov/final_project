# .github/workflows/terraform.yml

name: terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - "compute/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "compute/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_admin_cidr: ${{ secrets.ADMIN_CIDR }}
  TF_VAR_state_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
  TF_VAR_state_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_ssh_public_key_path: ${{ github.workspace }}/.ssh/id_k8s.pub

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [infra, compute]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"

      - name: сервисный ключ и публичный ssh-ключ
        working-directory: .
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.yc ~/.ssh
          printf '%s' "$YC_SA_KEY_JSON" > ~/.yc/authorized_key.json
          printf '%s\n' "$SSH_PUBLIC_KEY" > ~/.ssh/id_k8s.pub

      - name: backend.hcl
        run: |
          cat > backend.hcl <<EOF
          bucket = "final-project-tfstate-b1g3g3a6ro9rr9hd0mvm"
          key    = "${{ matrix.root }}/terraform.tfstate"
          region = "ru-central1"

          endpoints = {
            s3 = "https://storage.yandexcloud.net"
          }

          skip_region_validation      = true
          skip_credentials_validation = true
          skip_requesting_account_id  = true
          skip_s3_checksum            = true
          EOF

      - name: fmt
        run: terraform fmt -check -recursive .

      - name: init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: validate
        run: terraform validate -no-color

      - name: plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color -input=false -out=tfplan

      - name: apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          terraform plan -no-color -input=false -out=tfplan
          terraform apply -no-color -input=false tfplan
